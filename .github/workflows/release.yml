name: Release

# Push a tag that matches Resources/Info.plist (e.g. v0.2.0) to publish a release:
# universal Panespace.app and Caps.app, signed with the stable release identity, plus the signed Sparkle
# appcast that installed copies check for updates.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag matches the app version
        run: |
          v=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          c=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Caps-Info.plist)
          if [ "v$v" != "$GITHUB_REF_NAME" ] || [ "$v" != "$c" ]; then
            echo "::error::tag $GITHUB_REF_NAME, Info.plist $v, Caps-Info.plist $c: they must agree"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Import the release signing identity
        env:
          P12: ${{ secrets.SIGNING_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/release.keychain-db"
          KC_PASS=$(uuidgen)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security import "$RUNNER_TEMP/release.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/release.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Self-signed: trust it for code signing on this runner so codesign treats it as a valid identity.
          security find-certificate -c "Panespace Release Signing" -p "$KC" > "$RUNNER_TEMP/release.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/release.pem"
          ID=$(security find-identity -v -p codesigning "$KC" | awk '/Panespace Release Signing/ {print $2; exit}')
          if [ -z "$ID" ]; then security find-identity -p codesigning "$KC"; echo "::error::signing identity not found"; exit 1; fi
          echo "SIGN_ID=$ID" >> "$GITHUB_ENV"

      - name: Build, sign and make the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          make dist SIGN_ID="$SIGN_ID" SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle.key"
          rm "$RUNNER_TEMP/sparkle.key"

      - name: Verify the release
        run: |
          set -e
          codesign --verify --deep --strict --verbose=2 Panespace.app
          codesign --verify --deep --strict --verbose=2 Caps.app
          codesign -dvv Panespace.app 2>&1 | grep "Authority=Panespace Release Signing"
          test -d Panespace.app/Contents/Frameworks/Sparkle.framework
          lipo -archs Panespace.app/Contents/MacOS/panespace | grep -q x86_64
          lipo -archs Panespace.app/Contents/MacOS/panespace | grep -q arm64
          test "$(Panespace.app/Contents/MacOS/panespace --version)" = "$VERSION"
          /usr/libexec/PlistBuddy -c 'Print SUPublicEDKey' Panespace.app/Contents/Info.plist
          # The appcast's EdDSA signature must verify against the public key shipped in the app.
          ZIP="dist/Panespace-$VERSION.zip"
          grep -q "releases/download/v$VERSION/Panespace-$VERSION.zip" dist/appcast.xml
          SIG=$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' dist/appcast.xml | head -1)
          test -n "$SIG"
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          { printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00'; base64 --decode < Resources/sparkle-public-key; } > "$RUNNER_TEMP/pub.der"
          echo "$SIG" | base64 --decode > "$RUNNER_TEMP/sig.bin"
          "$OPENSSL" pkeyutl -verify -pubin -keyform DER -inkey "$RUNNER_TEMP/pub.der" -rawin \
            -in "$ZIP" -sigfile "$RUNNER_TEMP/sig.bin"
          cat dist/appcast.xml

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Panespace-$VERSION.zip" "dist/Caps-$VERSION.zip" dist/appcast.xml \
            --title "Panespace $VERSION" --generate-notes --verify-tag

      - name: Clean up the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
